<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Community / Launcher Support</title>
  <style>
    :root {
      --bg-page: #060608;
      --bg-card: #0e0e12;
      --bg-surface: #14141a;
      --bg-surface-hover: #191922;
      --border-subtle: #24242d;
      --border-strong: #343442;
      --text-primary: #f8fafc;
      --text-secondary: #d4d4dc;
      --text-muted: #9494a3;
      --accent-azure: #38bdf8;
      --accent-discord: #5865f2;
      --accent-discord-hover: #4752c4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image:
        radial-gradient(ellipse 80% 45% at 50% -10%, rgba(88, 101, 242, 0.16), transparent 70%),
        radial-gradient(ellipse 60% 35% at 50% 0%, rgba(56, 189, 248, 0.08), transparent 65%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseDot {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.8);
      }
    }

    .box {
      width: 100%;
      max-width: 600px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 30px 22px;
      box-shadow:
        0 28px 70px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
      background-color: #18181f;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.65),
        0 0 0 4px rgba(255, 255, 255, 0.04);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .avatar:hover {
      transform: scale(1.03);
      border-color: rgba(255, 255, 255, 0.45);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-azure);
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-azure);
      box-shadow: 0 0 8px var(--accent-azure);
      animation: pulseDot 2s ease-in-out infinite;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.3;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .section {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.005) 100%), var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .section:nth-of-type(1) {
      animation-delay: 0.12s;
    }

    .section:nth-of-type(2) {
      animation-delay: 0.2s;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
