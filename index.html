<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Community / Launcher Support</title>
  <style>
    :root {
      --bg: #090b10;
      --card: rgba(18, 22, 31, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #38bdf8;
      --discord: #5865F2;
      --discord-hover: #4752C4;
      --tiktok-bg: #141720;
      --tiktok-border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.14), transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(88, 101, 242, 0.14), transparent 50%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 540px;
      background: var(--card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
      text-align: center;
    }

    .avatar-wrap {
      width: 104px;
      height: 104px;
      margin: 0 auto 18px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #e5e7eb, #38bdf8, #4b5563);
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.25);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #111827;
      display: block;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
    }

    .music-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 16px;
      text-align: left;
    }

    .music-info {
      min-width: 0;
      flex: 1;
    }

    .music-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-sub {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 2px;
    }

    .music-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn-music {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      background: rgba(56, 189, 248, 0.14);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .btn-music:active {
      transform: scale(0.96);
    }

    .volume-slider {
      width: 64px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .lang-box {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .lang-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .lang-box p {
      font-size: 14.5px;
      line-height: 1.6;
      color: #e5e7eb;
    }

    .link-list {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 16px;
      padding: 14px 16px;
      margin-top: 14px;
      font-size: 13.5px;
      line-height: 1.75;
      color: #d1d5db;
    }

    .link-list a {
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
    }

    .link-list a:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-discord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      background: var(--discord);
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 600;
      text-decoration: none;
