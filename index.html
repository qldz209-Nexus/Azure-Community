<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Community / Launcher Support</title>
  <style>
    :root {
      --bg-page: #070908;
      --bg-card: #0d1210;
      --bg-surface: #131b18;
      --bg-surface-hover: #192420;
      --border-subtle: #21302a;
      --border-strong: #324a40;
      --text-primary: #f4f7f5;
      --text-secondary: #c7d4ce;
      --text-muted: #8fa39a;
      --accent-emerald: #10b981;
      --accent-emerald-soft: #34d399;
      --accent-amber: #f59e0b;
      --accent-discord: #5865f2;
      --accent-discord-hover: #6571f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-page);
      background-image:
        radial-gradient(ellipse 85% 45% at 50% -12%, rgba(16, 185, 129, 0.16), transparent 70%),
        radial-gradient(ellipse 70% 40% at 88% 10%, rgba(245, 158, 11, 0.11), transparent 65%),
        radial-gradient(ellipse 65% 35% at 12% 16%, rgba(52, 211, 153, 0.08), transparent 65%);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseDot {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.45;
        transform: scale(0.8);
      }
    }

    .box {
      width: 100%;
      max-width: 600px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.025) 0%, rgba(255, 255, 255, 0.005) 100%), var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 26px;
      padding: 30px 22px;
      box-shadow:
        0 30px 75px rgba(0, 0, 0, 0.88),
        0 0 0 1px rgba(16, 185, 129, 0.07),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid rgba(143, 163, 154, 0.14);
      animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .avatar-ring {
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-amber));
      box-shadow: 0 14px 32px rgba(16, 185, 129, 0.22);
      transition: transform 0.2s ease;
    }

    .avatar-ring:hover {
      transform: scale(1.03);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
      background-color: #151e1a;
      border: 2px solid var(--bg-card);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent-emerald-soft);
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.16), rgba(245, 158, 11, 0.12));
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 5px 13px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-emerald-soft);
      box-shadow: 0 0 8px var(--accent-emerald-soft);
      animation: pulseDot 2s ease-in-out infinite;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.3;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .section {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.022) 0%, rgba(255, 255, 255, 0.005) 100%), var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      animation: fadeSlideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .section:nth-of-type(1) {
      animation-delay: 0.12s;
    }

    .section:nth-of-type(2) {
      animation-delay: 0.2s;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(143, 163, 154, 0.12);
    }

    .label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #d1fae5;
      background-color: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.28);
      padding: 4px 11px;
      border-radius: 8px;
    }

    .section.section-en .label {
      color: #fef3c7;
      background-color: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .section-meta {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .intro-box {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.09), rgba(15, 26, 22, 0.45));
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-left: 3px solid var(--accent-emerald);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .section.section-en .intro-box {

      border-color: rgba(245, 158, 11, 0.22);
