<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Community / Launcher Support</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #050505;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.06), transparent 60%);
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 560px;
      background-color: #0c0c0e;
      border: 1px solid #232328;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
      background-color: #18181f;
      border: 2px solid rgba(255, 255, 255, 0.22);
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 18px;
      text-align: center;
    }

    .section {
      background-color: #131317;
      border: 1px solid #232329;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a1a1aa;
      margin-bottom: 10px;
    }

    p {
      font-size: 14.5px;
      line-height: 1.65;
      color: #e4e4e7;
    }

    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 11px;
      margin-top: 12px;
    }

    .info-list li {
      font-size: 13.8px;
      line-height: 1.62;
      color: #d4d4d8;
      padding-left: 12px;
      border-left: 2px solid #3f3f46;
    }

    .info-list strong {
      color: #ffffff;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.8px;
      background-color: #1c1c22;
      color: #f4f4f5;
      padding: 1px 5px;
      border-radius: 5px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 50px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.15s ease, transform 0.12s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-discord,
    .btn-discord span {
      background-color: #24242c;
      color: #ffffff;
      border: 1px solid #52525b;
    }

    .btn-discord span {
      background-color: transparent;
      border: none;
    }

    .btn-discord:hover {
      background-color: #2e2e38;
    }

    .btn-tiktok,
    .btn-tiktok span {
      background-color: #ffffff;
      color: #050505;
      border: 1px solid #ffffff;
    }

    .btn-tiktok span {
      background-color: transparent;
      border: none;
    }

    .btn-tiktok:hover {
      background-color: #e4e4e7;
    }

    .icon-svg {
      width: 22px;
      height: 22px;
      min-width: 22px;
      flex-shrink: 0;
      display: block;
    }
  </style>
</head>
