<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Community / Launcher Support</title>
  <style>
    :root {
      --bg-page: #f3f5f9;
      --bg-card: #ffffff;
      --bg-surface: #f8fafc;
      --bg-surface-hover: #f1f5f9;
      --border-subtle: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent-blue: #0284c7;
      --accent-blue-soft: #e0f2fe;
      --accent-slate: #1e293b;
      --accent-discord: #5865f2;
      --accent-discord-hover: #4752c4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 20px 14px 36px;
    }

    .box {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 26px 18px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .avatar-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
      background-color: #e2e8f0;
      border: 3px solid var(--accent-blue-soft);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.1);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent-blue);
      background-color: var(--accent-blue-soft);
      border: 1px solid #bae6fd;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-blue);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      line-height: 1.3;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .section {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .label {
      display: inline-flex;
      align-items: center;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent-blue);
      background-color: var(--accent-blue-soft);
      border: 1px solid #bae6fd;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .section-en .label {
      color: #334155;
      background-color: #e2e8f0;
      border-color: #cbd5e1;
    }

    .section-meta {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .intro-box {
      background-color: #ffffff;
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent-blue);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .section-en .intro-box {
      border-left-color: #475569;
    }

    .intro-text {
      font-size: 14px;
      line-height: 1.68;
      color: var(--text-primary);
    }

    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .info-list li {
      font-size: 13.8px;
      line-height: 1.65;
      color: var(--text-secondary);
      background-color: #ffffff;
      border: 1px solid var(--border-subtle);
      border-left: 3px solid var(--border-strong);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .info-title {
      display: block;
      font-size: 14.2px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .info-list strong {
      color: var(--text-primary);
      font-weight: 700;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.2px;
      background-color: #f1f5f9;
