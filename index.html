<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Community / Launcher Support</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f6f9;
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 14px 36px;
      line-height: 1.6;
    }

    .box {
      max-width: 600px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 24px 18px;
    }

    .header {
      text-align: center;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid #e5e7eb;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 12px;
      background-color: #e5e7eb;
      border: 2px solid #d1d5db;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111827;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13.5px;
      color: #4b5563;
    }

    .section {
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .label {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #1d4ed8;
      background-color: #dbeafe;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .intro {
      font-size: 14px;
      color: #111827;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-left: 3px solid #2563eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .list {
      list-style: none;
    }

    .list li {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13.5px;
      color: #374151;
    }

    .list li:last-child {
      margin-bottom: 0;
    }

    .list strong {
      display: block;
      color: #111827;
      margin-bottom: 4px;
    }

    code {
      background-color: #f3f4f6;
      color: #111827;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    .links {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
    }

    .links-title {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-discord {
      background-color: #5865f2;
      color: #ffffff;
    }

    .btn-tiktok {
      background-color: #ffffff;
      color: #111827;
      border: 2px solid #111827;
    }

    .icon-svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }
  </style>
</head>
