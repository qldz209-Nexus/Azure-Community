<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Community / Launcher Support</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: auto;
      background-color: #070709;
    }

    body {
      width: 100%;
      height: auto;
      min-height: 100vh;
      background-color: #070709;
      color: #f4f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.65;
      padding: 20px 14px 48px;
      overflow-x: hidden;
    }

    .box {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      margin: 0 auto;
      background-color: #0e0e12;
      border: 1px solid #22222a;
      border-radius: 18px;
      padding: 24px 18px;
      overflow: visible;
    }

    .header {
      display: block;
      text-align: center;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid #22222a;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 12px;
      background-color: #18181f;
      border: 2px solid #343440;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 13.5px;
      color: #a1a1aa;
    }

    .section {
      display: block;
      width: 100%;
      height: auto;
      background-color: #14141a;
      border: 1px solid #24242e;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 18px;
      overflow: visible;
    }

    .label {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: #e4e4e7;
      background-color: #23232d;
      border: 1px solid #343442;
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .intro {
      display: block;
      width: 100%;
      height: auto;
      font-size: 14px;
      color: #f4f4f6;
      background-color: #0f0f14;
      border: 1px solid #252530;
      border-left: 3px solid #ffffff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      overflow: visible;
    }

    .card-item {
      display: block;
      width: 100%;
      height: auto;
      background-color: #0f0f14;
      border: 1px solid #23232c;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 13.5px;
      color: #d4d4d8;
      overflow: visible;
    }

    .card-item:last-child {
      margin-bottom: 0;
    }

    .card-title {
      display: block;
      width: 100%;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }

    code {
      background-color: #1d1d26;
      color: #f4f4f6;
      border: 1px solid #2f2f3c;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
    }

    .links {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid #22222a;
      overflow: visible;
    }

    .links-title {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: #a1a1aa;
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-discord {
      background-color: #5865f2;
      color: #ffffff;
    }

    .btn-tiktok {
      background-color: #18181f;
      color: #ffffff;
      border: 1px solid #52525b;
    }

    .icon-svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #71717a;
    }
  </style>
</head>
